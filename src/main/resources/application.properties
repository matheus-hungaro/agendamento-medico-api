spring.application.name=agendamento-api

# Porta local da API; 8081 está em uso por outro processo no ambiente atual.
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/agendamento_api?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ceub123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ambiente local: atualiza o schema automaticamente se as tabelas ainda não existirem
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway: o schema do MySQL já existe localmente e não tem histórico do Flyway
# Desabilitar para evitar checksum mismatch em ambiente de desenvolvimento local.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Inicializa dados padrão do sistema quando a aplicação sobe localmente.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

api.security.token.secret=minha-chave-secreta-super-segura-123