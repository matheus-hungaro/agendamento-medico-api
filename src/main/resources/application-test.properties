# Banco em memória H2 para Testes
spring.datasource.url=jdbc:h2:mem:agendamento_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialeto JPA do H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway desativado nos testes (o Hibernate cria as tabelas via create-drop)
spring.flyway.enabled=false

# Segredo do JWT para ambiente de teste
api.security.token.secret=123456789
